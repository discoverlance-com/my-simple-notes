apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: my-sample-notes-app-test
  annotations:
    run.googleapis.com/invoker-iam-disabled: 'true'
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: '1'
    spec:
      serviceAccountName: demo-svc@omni-deploy-run.iam.gserviceaccount.com
      containers:
        - name: my-sample-notes
          image: my-sample-notes
